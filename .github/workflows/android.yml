name: Android Kotlin APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "web/**"
      - ".github/workflows/android.yml"

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VITE_API_BASE_URL: https://lingogoc-api.lingogoc-api.workers.dev
      VITE_SPEAKING_AUTO_LISTEN: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci
        working-directory: web

      - name: Verify bundled and cached offline catalog
        working-directory: web
        run: |
          npm run test:offline
          npm run test:android-bridge
          npm run test:android-release

      - name: Build debug APK
        working-directory: app
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --console=plain 2>&1 | tee android-build.log

      - name: Report Android build failure
        if: failure()
        working-directory: app
        run: |
          details="$(tail -n 120 android-build.log)"
          details="${details//'%'/'%25'}"
          details="${details//$'\r'/'%0D'}"
          details="${details//$'\n'/'%0A'}"
          echo "::error title=Android build failed::$details"
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: lingogoc-android-debug
          path: app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
